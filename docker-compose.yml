services:
  frontend:
    build:
      context: ./frontend
    container_name: gearshare_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: gearshare_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    environment:
      DATABASE_URL: mysql://gearshare:gearshare@database:3306/gearshare?serverVersion=8.4.0&charset=utf8mb4
    command: symfony local:server:start --listen-ip=0.0.0.0 --port=8000 --allow-http
    depends_on:
      - database

  database:
    image: mysql:8.4
    container_name: gearshare_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gearshare
      MYSQL_USER: gearshare
      MYSQL_PASSWORD: gearshare
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data: